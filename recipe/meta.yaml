{% set name = "cssselect" %}
{% set version = "1.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 57f8a99424cfab289a1b6a816a43075a4b00948c86b4dcf3ef4ee7e15f7ab0c7

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - cssselect
  requires:
    - pip
    - pytest
    # Not in main channel
    - lxml  # [not (win and arm64)]
  commands:
    - pip check
    - pytest -v tests

about:
  home: https://pythonhosted.org/cssselect
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  summary: CSS Selectors for Python
  description: |
    Cssselect parses CSS3 Selectors and translate them to XPath 1.0
    expressions. Such expressions can be used in lxml or another XPath engine
    to find the matching elements in an XML or HTML document.
  doc_url: https://cssselect.readthedocs.io
  dev_url: https://github.com/scrapy/cssselect

extra:
  recipe-maintainers:
    - vamega
